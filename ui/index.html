<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <!-- 标题栏 -->
  <header class="app-header">
    <div class="drag-zone pywebview-drag-region">
      <div class="brand">
        <span class="logo">◈</span>
        <span class="brand-title">DeepSeek Monitor</span>
      </div>
      <span class="rollup-hint">▾</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-refresh" title="刷新">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" title="主题">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="设置">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="btn-minimize" title="最小化">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btn-close" title="关闭">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <!-- 账户概览（弧环 = 今日消耗占预算，签名元素） -->
  <section class="card balance-card">
    <div class="balance-head">
      <span class="balance-label">账户余额</span>
      <span class="status-chip" id="balance-chip"><span class="dot"></span>可用</span>
    </div>
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 120 120">
        <circle class="gauge-circle gauge-track" cx="60" cy="60" r="52" pathLength="360" transform="rotate(120 60 60)"/>
        <circle class="gauge-circle gauge-fill" id="gauge-fill" cx="60" cy="60" r="52" pathLength="360" transform="rotate(120 60 60)"/>
      </svg>
      <div class="gauge-center">
        <div class="balance-value" id="balance-value">--</div>
        <div class="gauge-caption">
          <div class="gc-row"><span class="gc-label">消耗</span><b class="orange" id="today-cost">--</b></div>
          <div class="gc-row"><span class="gc-label">Tokens</span><b class="blue" id="today-tokens">--</b></div>
        </div>
      </div>
    </div>
    <div class="warn-note" id="cost-warn" hidden>⚠ 超预算</div>
  </section>

  <!-- 模型卡片（动态插入） -->
  <div id="model-cards"></div>

  <!-- 缓存命中明细 -->
  <section class="card chart-card">
    <div class="chart-head">
      <span class="chart-title">缓存命中明细</span>
      <span class="chart-summary" id="chart-summary">--</span>
    </div>
    <div class="chart-bars" id="chart-bars"></div>
    <div class="chart-legend">
      <span class="legend-item"><span class="legend-dot green"></span>命中</span>
      <span class="legend-item"><span class="legend-dot orange"></span>未命中</span>
      <span class="legend-item"><span class="legend-dot purple"></span>输出</span>
    </div>
  </section>

  <footer class="app-footer" id="footer">--</footer>
</div>
<div class="toast" id="toast" role="alert" hidden></div>
<script src="app.js"></script>
</body>
</html>
